<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Aylin Market</title>
<meta name="theme-color" content="#4a0e34" id="metaTheme">
<meta name="apple-mobile-web-app-title" content="Aylin Market">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" id="fav" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f9f4f7;
  --sf: #ffffff;
  --sf2: #f3e8ef;
  --ink: #220f1b;
  --mu: #7a5c6f;
  --ac: #7b1e58;
  --ac2: #420b2d;
  --acf: #ffffff;
  --ln: #e8d7e2;
  --hi: #fff9eb;
  --hit: #b46900;
  --gold: #e5b84b;
  --gold-lt: #f9e3a0;
  --shd: 0 10px 28px -6px rgba(94, 20, 66, 0.08), 0 3px 8px -2px rgba(94, 20, 66, 0.04);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #11070e;
  --sf: #1d0e18;
  --sf2: #2b1523;
  --ink: #f8eef4;
  --mu: #b597aa;
  --ac: #d64ea0;
  --ac2: #2e0820;
  --acf: #ffffff;
  --ln: #361e2d;
  --hi: #2e2007;
  --hit: #fbbf24;
  --gold: #f59e0b;
  --gold-lt: #fde68a;
  --shd: 0 12px 32px -8px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
input, textarea { user-select: auto; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
  padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px));
  transition: background-color .35s ease, color .35s ease;
  overflow-x: hidden;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
h1 { font-size: 20px; font-weight: 700; margin: 8px 0 14px; letter-spacing: -0.2px; }
input, select, button { font: inherit; color: inherit; }

/* Luxury Minimalist Animations */
@keyframes cardIn {
  0% { opacity: 0; transform: translateY(18px) scale(0.96); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes goldHalo {
  0%, 100% { box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(229, 184, 75, 0.45); }
  50% { box-shadow: 0 0 0 3.5px var(--gold-lt), 0 0 28px rgba(229, 184, 75, 0.85); }
}
@keyframes shimmerSweep {
  0% { transform: translateX(120%) skewX(-20deg); }
  100% { transform: translateX(-160%) skewX(-20deg); }
}
@keyframes ambientBg {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
@keyframes popScale {
  0% { transform: scale(0.8); opacity: 0; }
  70% { transform: scale(1.06); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes pulseRing {
  0% { box-shadow: 0 0 0 0 rgba(229, 184, 75, 0.55); }
  70% { box-shadow: 0 0 0 10px rgba(229, 184, 75, 0); }
  100% { box-shadow: 0 0 0 0 rgba(229, 184, 75, 0); }
}

/* Luxury Hero Header */
.hero {
  background: radial-gradient(circle at 85% 15%, rgba(229, 184, 75, 0.24), transparent 42%),
              radial-gradient(circle at 12% 80%, rgba(214, 78, 160, 0.2), transparent 48%),
              linear-gradient(135deg, #7b1e58 0%, #4a0e34 55%, #2b061d 100%);
  background-size: 160% 160%;
  animation: ambientBg 10s ease infinite;
  color: #fff;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 0 32px;
  border-radius: 0 0 32px 32px;
  box-shadow: 0 14px 34px rgba(58, 10, 40, 0.32);
  margin-bottom: -22px;
  position: relative;
  overflow: hidden;
  z-index: 2;
}
.hero::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0; width: 65%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
  animation: shimmerSweep 6.5s infinite ease-in-out;
  pointer-events: none;
}
.hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; position: relative; z-index: 2; }
.brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
.lgo {
  flex: none; width: 58px; height: 58px; border-radius: 50%; object-fit: cover;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 24px;
  animation: goldHalo 3.5s infinite ease-in-out;
  border: 2px solid #fff;
  transition: transform .3s var(--spring);
}
.lgo:active { transform: scale(1.1) rotate(-4deg); }
.bn { font-size: 21px; font-weight: 700; line-height: 1.18; letter-spacing: -0.3px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.25); }
.bs { font-size: 12.5px; color: rgba(255, 255, 255, 0.86); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.bs::before { content: "✦"; color: var(--gold); font-size: 11px; }
.hdr-btns { display: flex; gap: 7px; }
.mnb {
  flex: none; width: 41px; height: 41px; border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.13);
  backdrop-filter: blur(10px);
  color: #fff; font-size: 17px; cursor: pointer;
  display: grid; place-items: center;
  transition: transform .2s var(--spring), background .2s;
}
.mnb:active { transform: scale(0.86); background: rgba(255, 255, 255, 0.28); }

/* Search Bar */
.search-box {
  position: relative; z-index: 3; margin: 0 0 12px;
}
.search-box .in {
  padding-inline-start: 42px;
  padding-inline-end: 38px;
  background: var(--sf);
  border: 1.5px solid var(--ln);
  box-shadow: var(--shd);
  border-radius: 18px;
  height: 52px;
  font-size: 15px;
}
.search-ic {
  position: absolute; inset-inline-start: 15px; top: 50%; transform: translateY(-50%);
  color: var(--mu); pointer-events: none; font-size: 17px;
}
.clear-q {
  position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px; border-radius: 50%; border: 0;
  background: var(--sf2); color: var(--mu); font-size: 13px; cursor: pointer;
  display: grid; place-items: center;
}

/* Dashboard Summary Pills */
.dash {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 12px;
}
.d-card {
  background: var(--sf); border: 1px solid var(--ln); border-radius: 18px;
  padding: 10px 10px; box-shadow: var(--shd); text-align: center;
  position: relative; overflow: hidden;
  animation: popScale .4s var(--spring) both;
}
.d-card::before {
  content: ""; position: absolute; top: 0; inset-inline: 25%; height: 2.5px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}
.d-card span { font-size: 11.5px; color: var(--mu); display: block; font-weight: 500; }
.d-card b { font-size: 17px; font-weight: 700; color: var(--ac); display: block; margin-top: 2px; }

/* Filter & Sort Tabs */
.tabs-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
}
.tabs-bar::-webkit-scrollbar { display: none; }
.f-tabs { display: flex; gap: 6px; }
.tab-pill {
  border: 1px solid var(--ln); background: var(--sf); color: var(--mu);
  padding: 6px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
  white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  transition: all .22s var(--spring);
}
.tab-pill:active { transform: scale(0.92); }
.tab-pill.on {
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff; border-color: transparent;
  box-shadow: 0 4px 12px rgba(123, 30, 88, 0.28);
}
.tab-cnt {
  background: rgba(255,255,255,0.22); padding: 0 6px; border-radius: 99px; font-size: 11px;
}
.tab-pill:not(.on) .tab-cnt { background: var(--sf2); color: var(--ink); }

/* Inputs */
.in {
  width: 100%; padding: 13px 14px; border: 1.5px solid var(--ln);
  border-radius: 15px; background: var(--sf);
  transition: border-color .25s, box-shadow .25s, transform .15s;
}
.in:focus {
  border-color: var(--ac); outline: none;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 16%, transparent);
}

/* Product Cards & External Selection */
.row-wrap {
  position: relative; margin-bottom: 10px;
  animation: cardIn .42s var(--ease) both;
}
.row {
  display: grid; grid-template-columns: 30px 54px 1fr auto 32px; gap: 10px; align-items: center;
  width: 100%; text-align: start; background: var(--sf);
  border: 1.5px solid var(--ln); border-radius: 20px;
  padding: 11px 10px; cursor: pointer;
  box-shadow: var(--shd);
  transition: transform .22s var(--spring), border-color .22s, background-color .22s, box-shadow .22s;
  position: relative; overflow: hidden;
}
.row.detail-row {
  grid-template-columns: 54px 1fr auto 32px;
}
.row:active { transform: scale(0.98); }
.row.selected {
  border-color: var(--ac);
  background: color-mix(in srgb, var(--ac) 7%, var(--sf));
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--ac) 22%, transparent), var(--shd);
}
.row.pinned {
  border-color: color-mix(in srgb, var(--gold) 65%, var(--ln));
}

/* Selection Circle */
.sel-chk {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--ln); background: var(--sf2);
  display: grid; place-items: center; color: transparent;
  font-size: 13px; font-weight: 700; cursor: pointer;
  transition: all .22s var(--spring);
}
.row.selected .sel-chk {
  background: var(--ac); border-color: var(--ac); color: #fff;
  transform: scale(1.08);
  animation: pulseRing .6s ease;
}
.sel-chk:hover { border-color: var(--ac); }

/* Quick Action 3-dots Button on Card */
.act-btn {
  width: 32px; height: 36px; border-radius: 11px; border: 0;
  background: transparent; color: var(--mu); font-size: 19px; font-weight: 700;
  display: grid; place-items: center; cursor: pointer;
  transition: background .2s, color .2s, transform .2s var(--spring);
}
.act-btn:hover, .act-btn:active {
  background: var(--sf2); color: var(--ac); transform: scale(1.1);
}

.th-box { position: relative; width: 54px; height: 54px; }
.th {
  width: 54px; height: 54px; border-radius: 15px;
  background: linear-gradient(135deg, var(--sf2), var(--ln));
  object-fit: cover; display: grid; place-items: center;
  color: var(--ac); font-weight: 700; font-size: 20px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
}
.pin-badge {
  position: absolute; top: -4px; inset-inline-start: -4px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--gold); color: #24111d; font-size: 11px;
  display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.cart-badge {
  position: absolute; bottom: -4px; inset-inline-end: -4px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--ac); color: #fff; font-size: 10px;
  display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.item-title { font-weight: 700; font-size: 15.5px; margin-bottom: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.pr { font-weight: 700; font-size: 16.5px; text-align: end; color: var(--ac); white-space: nowrap; }
.sub { color: var(--mu); font-size: 12px; }
.pill {
  display: inline-block; background: var(--sf2); color: var(--ink);
  padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; margin-top: 3px;
}
.best {
  border: 1.5px solid var(--gold);
  background: linear-gradient(to left, var(--hi), var(--sf) 70%);
}
.tag {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10.5px; background: var(--hi); color: var(--hit);
  border: 1px solid color-mix(in srgb, var(--hit) 30%, transparent);
  padding: 1.5px 7px; border-radius: 99px; font-weight: 700;
}

/* Detail View Stats */
.detail-hd {
  padding: calc(14px + env(safe-area-inset-top, 0px)) 0 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--sf); border: 1px solid var(--ln); color: var(--ink);
  padding: 8px 14px; border-radius: 13px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shd); transition: transform .2s var(--spring);
}
.back-btn:active { transform: scale(0.92); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 12px 0 18px; }
.stat {
  background: var(--sf); border: 1px solid var(--ln); border-radius: 18px;
  padding: 12px 10px; box-shadow: var(--shd); position: relative; overflow: hidden;
  animation: popScale .38s var(--spring) both;
}
.stat::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 3px;
  background: var(--ac); opacity: .7;
}
.stat.st-best::after { background: var(--gold); opacity: 1; }
.stat b { display: block; font-size: 19px; font-weight: 700; margin: 2px 0; color: var(--ink); }

/* Bottom Floating Action Bar */
.bar {
  position: fixed; inset: auto 0 0 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
  backdrop-filter: blur(6px);
  z-index: 5; pointer-events: none;
  transition: transform .3s var(--ease), opacity .3s;
}
.bar.hide { transform: translateY(120%); opacity: 0; }
.bar .btn { pointer-events: auto; max-width: 528px; margin: 0 auto; box-shadow: 0 12px 28px rgba(123, 30, 88, 0.4); }

/* Floating Multi-Select / Quick Action Bar */
.sel-bar {
  position: fixed; inset: auto 12px calc(12px + env(safe-area-inset-bottom, 0px)) 12px;
  max-width: 536px; margin: 0 auto;
  background: rgba(34, 15, 27, 0.94);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(229, 184, 75, 0.35);
  border-radius: 22px;
  padding: 10px 12px;
  color: #fff;
  z-index: 8;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
  transform: translateY(140%);
  opacity: 0;
  pointer-events: none;
  transition: transform .35s var(--spring), opacity .25s ease;
}
.sel-bar.on { transform: translateY(0); opacity: 1; pointer-events: auto; }
.sel-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.12);
  margin-bottom: 8px; font-size: 13px; font-weight: 600;
}
.sel-top b { color: var(--gold); }
.sel-close {
  background: rgba(255,255,255,0.12); border: 0; color: #fff;
  padding: 3px 10px; border-radius: 99px; font-size: 12px; cursor: pointer;
}
.sel-actions {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
}
.s-act {
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px; padding: 8px 4px; color: #fff;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 11.5px; font-weight: 600; cursor: pointer;
  transition: transform .18s var(--spring), background .2s;
}
.s-act span { font-size: 17px; }
.s-act:active { transform: scale(0.9); background: rgba(255,255,255,0.22); }
.s-act.primary { background: linear-gradient(135deg, var(--ac), #521039); border-color: var(--gold); }
.s-act.del-act { color: #fda4af; }

/* Action Menu Grid inside Context Sheet */
.ctx-head {
  display: flex; align-items: center; gap: 12px;
  padding-bottom: 12px; border-bottom: 1px solid var(--ln); margin-bottom: 12px;
}
.ctx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.ctx-item {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 12px; border-radius: 16px;
  background: var(--sf); border: 1.5px solid var(--ln);
  font-weight: 600; font-size: 13.5px; cursor: pointer; text-align: start;
  transition: transform .18s var(--spring), border-color .2s;
}
.ctx-item:active { transform: scale(0.96); }
.ctx-item.full { grid-column: 1 / -1; }
.ctx-item.hi-act {
  background: linear-gradient(135deg, color-mix(in srgb, var(--ac) 12%, var(--sf)), var(--sf));
  border-color: var(--ac); color: var(--ac);
}
.ctx-item.danger { color: #e11d48; border-color: rgba(225, 29, 72, 0.25); }
.ctx-ic {
  width: 36px; height: 36px; border-radius: 11px;
  background: var(--sf2); display: grid; place-items: center; font-size: 18px; flex: none;
}

/* Toast Notification */
.toast {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); inset-inline: 16px;
  max-width: 420px; margin: 0 auto;
  background: rgba(34, 15, 27, 0.95); color: #fff;
  border: 1px solid var(--gold); border-radius: 99px;
  padding: 10px 18px; font-size: 13.5px; font-weight: 600;
  text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,0.35);
  z-index: 60; pointer-events: none;
  transform: translateY(-140%); opacity: 0;
  transition: transform .35s var(--spring), opacity .25s;
}
.toast.on { transform: translateY(0); opacity: 1; }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 15px; border: 0; border-radius: 16px;
  background: linear-gradient(135deg, var(--ac), #4e0f36);
  color: var(--acf); font-weight: 700; font-size: 15.5px; cursor: pointer;
  transition: transform .2s var(--spring), opacity .2s, box-shadow .2s;
}
.btn:active { transform: scale(0.96); }
.btn.g {
  background: var(--sf); color: var(--ink);
  border: 1.5px solid var(--ln); margin-top: 9px; box-shadow: none; font-weight: 600;
}
.btn.danger { color: #e11d48; border-color: rgba(225, 29, 72, 0.25); }
.btn:disabled { opacity: .5; pointer-events: none; }
.link { background: none; border: 0; color: var(--ac); padding: 8px 0; font-weight: 600; cursor: pointer; }

/* Animated Bottom Sheets & Modals */
.sheet {
  position: fixed; inset: 0;
  background: rgba(15, 5, 12, 0.58);
  backdrop-filter: blur(8px);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 20; opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .28s var(--ease), visibility .28s;
}
.sheet.on { opacity: 1; visibility: visible; pointer-events: auto; }
.sheet > .wrap {
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  background: var(--bg);
  border-radius: 28px 28px 0 0;
  padding: 12px 18px calc(28px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.32);
  transform: translateY(100%);
  transition: transform .36s var(--ease);
}
.sheet.on > .wrap { transform: translateY(0); }
.sheet > .wrap::before {
  content: ""; display: block; width: 42px; height: 5px;
  background: var(--ln); border-radius: 99px; margin: 4px auto 14px;
}

/* Fullscreen Login Screen */
#lg.sheet { align-items: stretch; background: linear-gradient(155deg, #5e1442 0%, #240619 100%); z-index: 40; }
#lg > .wrap {
  max-height: none; border-radius: 0; background: transparent; color: #fff;
  display: flex; flex-direction: column; justify-content: center;
  transform: scale(0.96); box-shadow: none;
}
#lg.on > .wrap { transform: scale(1); }
#lg > .wrap::before { display: none; }
.lg-card {
  background: var(--sf); color: var(--ink);
  padding: 22px 18px; border-radius: 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}
.lg-hero { text-align: center; margin-bottom: 22px; }
.lg-hero .brand { flex-direction: column; gap: 10px; }
.lg-hero .lgo { width: 92px; height: 92px; font-size: 34px; }
.lg-hero .bn { font-size: 26px; }

label { display: block; font-size: 13px; font-weight: 600; color: var(--mu); margin: 12px 0 5px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.prev { width: 100%; max-height: 210px; object-fit: cover; border-radius: 14px; margin-top: 10px; border: 1px solid var(--ln); }
.banner { background: var(--hi); color: var(--hit); padding: 12px 14px; border-radius: 14px; margin: 12px 0; font-weight: 600; border: 1px solid color-mix(in srgb, var(--hit) 30%, transparent); }
.err { color: #e11d48; min-height: 20px; font-size: 13.5px; font-weight: 600; margin: 8px 0; }
.empty {
  color: var(--mu); text-align: center; padding: 40px 16px;
  background: var(--sf); border: 1.5px dashed var(--ln); border-radius: 22px; margin-top: 12px;
  animation: popScale .35s var(--ease) both;
}
.empty-ic { font-size: 38px; display: block; margin-bottom: 8px; }
[hidden] { display: none !important; }
</style>
</head>
<body>

let soundOn = localStorage.getItem('sfx') !== '0';
let actx = null;
function sfx(type='tap'){
  if(navigator.vibrate){
    if(type==='select'||type==='tap') navigator.vibrate(8);
    else if(type==='delete') navigator.vibrate([18,30,18]);
    else if(type==='success') navigator.vibrate([10,25,15]);
  }
  if(!soundOn) return;
  try{
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const now = actx.currentTime;
    const tone = (freq, endFreq, dur, vol=0.08, wave='sine', delay=0) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = wave;
      o.frequency.setValueAtTime(freq, now + delay);
      if(endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, now + delay + dur);
      g.gain.setValueAtTime(0.0001, now + delay);
      g.gain.linearRampToValueAtTime(vol, now + delay + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, now + delay + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(now + delay); o.stop(now + delay + dur + 0.02);
    };
    if(type==='tap'){
      tone(520, 260, 0.055, 0.06, 'sine', 0);
    } else if(type==='select'){
      tone(680, 920, 0.07, 0.075, 'triangle', 0);

      tone(1174.66, 1174.66, 0.26, 0.06, 'triangle', 0.15);
    } else if(type==='delete'){
      tone(300, 150, 0.16, 0.08, 'sawtooth', 0);
    }
  }catch(e){}
}

let LOGO=DEFAULT_LOGO;
try{LOGO=localStorage.getItem('brandLogoV2')||DEFAULT_LOGO}catch(e){}
const brandHtml=()=>`<img class="lgo" src="${LOGO}" alt="Aylin Market"><div><div class="bn">Aylin Market</div><div class="bs">مشتريات البيت الذكية</div></div>`;
function paintBrand(){
  document.querySelectorAll('.brand').forEach(b=>b.innerHTML=brandHtml());
  if(LOGO)$('fav').href=LOGO;
}
const isOwner=()=>!!auth.currentUser&&(auth.currentUser.email||'').toLowerCase()===OWNER;
const who=()=>((auth.currentUser&&auth.currentUser.email)||'').split('@')[0];

function groups(){
  const m=new Map();
  for(const p of P){const k=p.item;if(!m.has(k))m.set(k,[]);m.get(k).push(p)}
  for(const a of m.values())a.sort((x,y)=>(y.date||'').localeCompare(x.date||'')||y.ts-x.ts);
  return m;
}
const thumb=(p,k)=>{
  const pinB = k && pinned.has(k) ? '<span class="pin-badge" title="مثبت">★</span>' : '';
  const cartB = k && cart.has(k) ? '<span class="cart-badge" title="في قائمة التسوق">🛒</span>' : '';
  const img = p.photo ? `<img class="th" alt="" data-ph="${esc(p.id)}">` : `<div class="th">${esc((p.item||'أ')[0])}</div>`;
  return `<div class="th-box">${img}${pinB}${cartB}</div>`;
};

const nz=v=>String(v==null?'':v).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
const FL=[['item','البند'],['brand','الماركة'],['store','المكان'],['note','ملاحظة'],['by','أضافها'],['price','السعر'],['qty','الوزن'],['date','التاريخ']];
function matchP(p,ws){const t=nz([p.item,p.brand,p.store,p.note,p.by,p.date,fd(p.date),p.price,p.qty,U[p.unit][0]].join(' '));return ws.every(w=>t.includes(w))}
function whyP(p,w){for(const [k,l] of FL){const v=k==='date'?fd(p.date):p[k];if(nz(v).includes(w))return l+': '+(k==='qty'?num(v)+' '+U[p.unit][0]:v)}return ''}

function dashHtml(m){
  const curMonth=today().slice(0,7);
  const mSum=P.filter(p=>(p.date||'').startsWith(curMonth)).reduce((a,b)=>a+(+b.price||0),0);
  return `<div class="dash">
    <div class="d-card" style="animation-delay:0s"><span>الأصناف</span><b>${m.size}</b></div>
    <div class="d-card" style="animation-delay:0.05s"><span>المشتريات</span><b>${P.length}</b></div>
    <div class="d-card" style="animation-delay:0.1s"><span>مشتريات الشهر</span><b>${num(mSum)} <small style="font-size:11px">ر.س</small></b></div>
  </div>`;
}

function tabsHtml(m){
  const pinCnt = [...m.keys()].filter(k=>pinned.has(k)).length;
  const cartCnt = [...m.keys()].filter(k=>cart.has(k)).length;
  const sortLabel = sortBy==='date'?'الأحدث ⇅':(sortBy==='count'?'الأكثر شراءً ⇅':'الأعلى سعراً ⇅');
  return `<div class="tabs-bar">
    <div class="f-tabs">
      <button class="tab-pill${activeFilter==='all'?' on':''}" data-flt="all" type="button">الكل <span class="tab-cnt">${m.size}</span></button>
      <button class="tab-pill${activeFilter==='pinned'?' on':''}" data-flt="pinned" type="button">📌 المثبتة <span class="tab-cnt">${pinCnt}</span></button>
      <button class="tab-pill${activeFilter==='cart'?' on':''}" data-flt="cart" type="button">🛒 للتسوق <span class="tab-cnt">${cartCnt}</span></button>
    </div>

}

function homeList(m){
  if(!m.size)return '<div class="empty"><span class="empty-ic">🛒</span>لا توجد مشتريات مسجلة بعد.<br>ابدأ بتسجيل أول مشترى من الزر بالأسفل.</div>';
  const ws=nz(q).split(/\s+/).filter(Boolean);
  let ents=[...m.entries()].map(([k,r])=>{
    if(activeFilter==='pinned' && !pinned.has(k)) return null;
    if(activeFilter==='cart' && !cart.has(k)) return null;
    if(!ws.length)return{k,r,why:''};
    const hp=r.find(p=>matchP(p,ws));if(!hp)return null;
    const rest=ws.find(w=>!nz(k).includes(w));
    return{k,r,why:rest?whyP(hp,rest):''};
  }).filter(Boolean);

  if(!ents.length){
    if(activeFilter==='pinned') return '<div class="empty"><span class="empty-ic">📌</span>لا توجد أصناف مثبتة بعد.<br>اضغط على (⋮) بجانب أي صنف لتثبيته في المقدمة.</div>';
    if(activeFilter==='cart') return '<div class="empty"><span class="empty-ic">🛒</span>قائمة التسوق فارغة حالياً.<br>حدد أي صنف من الخارج وأضفه لقائمة التسوق لتتذكر شراءه.</div>';
    return '<div class="empty"><span class="empty-ic">🔍</span>لا توجد نتائج مطابقة لبحثك.</div>';
  }

  ents.sort((a,b)=>{
    const pa = pinned.has(a.k)?1:0, pb = pinned.has(b.k)?1:0;
    if(pa !== pb) return pb - pa;
    if(sortBy==='count') return b.r.length - a.r.length;
    if(sortBy==='price') return b.r[0].price - a.r[0].price;
    return (b.r[0].date||'').localeCompare(a.r[0].date||'');
  });

  return ents.map(({k,r,why},idx)=>{
    const l=r[0];
    const isSel = selected.has(k);
    const isPin = pinned.has(k);
    const bUnit=U[l.unit][1];
    const same=r.filter(p=>U[p.unit][1]===bUnit);
    const minPpu=Math.min(...same.map(ppu));
    const isBestNow = same.length>1 && ppu(l)===minPpu;
    return `<div class="row-wrap" style="animation-delay:${Math.min(idx*0.04,0.36)}s">
      <div class="row${isSel?' selected':''}${isPin?' pinned':''}" data-item="${esc(k)}">
        <div class="sel-chk" data-sel="${esc(k)}" title="تحديد المنتج">✓</div>
        ${thumb(l,k)}
        <div style="min-width:0">
          <div class="item-title">
            <span>${esc(k)}</span>
            ${isBestNow?'<span class="tag">★ بأرخص سعر</span>':''}
          </div>
          <div class="sub">${r.length} عملية · آخرها ${fd(l.date)}${l.store?' · '+esc(l.store):''}</div>
          ${why?`<div class="sub" style="color:var(--ac);font-weight:600">${esc(why)}</div>`:''}
        </div>
        <div class="pr">${num(l.price)} <small style="font-size:11.5px">ر.س</small><div><span class="pill">${esc(l.brand||'بدون ماركة')}</span></div></div>
        <button class="act-btn" data-menu="${esc(k)}" type="button" aria-label="خيارات سريعة">⋮</button>
      </div>
    </div>`;
  }).join('');
}

function itemView(rows){
  const b=U[rows[0].unit][1],same=rows.filter(p=>U[p.unit][1]===b);
  const pp=same.map(ppu),min=Math.min(...pp),avg=pp.reduce((a,c)=>a+c,0)/pp.length;
  const best=same.find(p=>ppu(p)===min),l=rows[0],u=BL[b];
  const ws=nz(q).split(/\s+/).filter(Boolean);
  const list=rows.map((p,idx)=>{

          ${p.note?`<div class="sub" style="color:var(--ac)">📝 ${esc(p.note)}</div>`:''}
        </div>
        <div class="pr">${num(p.price)} <small style="font-size:11.5px">ر.س</small><div class="sub">${num(ppu(p))} / ${BL[U[p.unit][1]]}</div></div>
        <button class="act-btn" data-recmenu="${esc(p.id)}" type="button" aria-label="خيارات السجل">⋮</button>
      </div>
    </div>`}).join('');
  return `<div class="wrap"><div class="detail-hd">
    <button class="back-btn" id="back" type="button">‹ كل البنود</button>
    <div style="display:flex;gap:6px">
      <button class="back-btn" data-dupitem="${esc(l.item)}" type="button" style="color:var(--ac);border-color:var(--ac)">✨ نسخ مع التعديل</button>

    </div>
  </div>
  <h1>${esc(l.item)}</h1>
  <div class="stats">
    <div class="stat"><span class="sub">آخر سعر</span><b>${num(l.price)}</b><span class="sub">${num(ppu(l))} / ${u}</span></div>
    <div class="stat st-best" style="animation-delay:.05s"><span class="sub">أرخص سعر</span><b>${num(min)}</b><span class="sub">/ ${u} · ${esc(best.brand)||'—'}</span></div>
    <div class="stat" style="animation-delay:.1s"><span class="sub">المتوسط</span><b>${num(avg)}</b><span class="sub">/ ${u}</span></div>
  </div>${list}</div>`;
}

function shrink(f){return new Promise((res,rej)=>{
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);let d=c.toDataURL('image/jpeg',.6);if(d.length>230000)d=c.toDataURL('image/jpeg',.35);res(d)};
  im.onerror=rej;im.src=u;
})}

// التفاعلات والأحداث العامة
document.addEventListener('click',async e=>{
  // زر الصوت
  if(e.target.closest('#sfxBtn')){
    soundOn = !soundOn;
    localStorage.setItem('sfx', soundOn ? '1' : '0');
    applyTheme();
    if(soundOn) sfx('success');
    showToast(soundOn ? 'تم تفعيل المؤثرات الصوتية 🔊' : 'تم كتم المؤثرات الصوتية 🔇');
    return;
  }
  // زر الثيم
  if(e.target.closest('#thBtn')){
    sfx('tap');
    theme=theme==='dark'?'light':'dark';localStorage.setItem('theme',theme);applyTheme();return;
  }
  // مسح البحث
  if(e.target.closest('#clrQ')){
    sfx('tap');q='';$('q').value='';$('clrQ').hidden=true;$('list').innerHTML=homeList(groups());return;
  }
  // الفلاتر والترتيب
  const flt = e.target.closest('[data-flt]');
  if(flt){
    sfx('tap');activeFilter=flt.dataset.flt;render();return;
  }
  if(e.target.closest('#sortBtn')){
    sfx('tap');
    sortBy = sortBy==='date'?'count':(sortBy==='count'?'price':'date');
    render();return;
  }
  // تحديد منتج من الخارج (Checkbox)
  const selEl = e.target.closest('[data-sel]');
  if(selEl){
    e.stopPropagation();
    const k = selEl.dataset.sel;
    if(selected.has(k)){ selected.delete(k); sfx('tap'); }
    else { selected.add(k); sfx('select'); }
    render();
    return;
  }
  // فتح قائمة الخيارات السريعة من الخارج (⋮)
  const menuBtn = e.target.closest('[data-menu]');
  if(menuBtn){
    e.stopPropagation();
    openItemContextMenu(menuBtn.dataset.menu, null);
    return;
  }
  // فتح قائمة الخيارات لسجل داخل صفحة التفاصيل
  const recMenuBtn = e.target.closest('[data-recmenu]');
  if(recMenuBtn){
    e.stopPropagation();
    const p = P.find(x=>x.id===recMenuBtn.dataset.recmenu);
    if(p) openItemContextMenu(p.item, p);
    return;
  }
  // زر نسخ مع التعديل المباشر في صفحة التفاصيل
  const dupBtn = e.target.closest('[data-dupitem]');
  if(dupBtn){
    const rows = groups().get(dupBtn.dataset.dupitem);
    if(rows && rows[0]) openSheet(rows[0], false, true);
    return;
  }
  // تنفيذ أمر من داخل نافذة الخيارات السريعة (Context Sheet)
  const cact = e.target.closest('[data-cact]');
  if(cact){
    const act = cact.dataset.cact;
    const m = groups();
    const rows = m.get(ctxTargetItem) || [];
    const targetRec = ctxTargetRec || rows[0];
    if(!targetRec) return;

    if(act === 'dup'){
      $('actSh').classList.remove('on');
      openSheet(targetRec, false, true);
      showToast('تم نسخ البيانات، عدّل السعر أو احفظ مباشرة ✨');
    } else if(act === 'edit'){
      $('actSh').classList.remove('on');
      openSheet(targetRec, true, false);
    } else if(act === 'pin'){
      if(pinned.has(ctxTargetItem)){ pinned.delete(ctxTargetItem); showToast('تم إلغاء التثبيت'); }
      else { pinned.add(ctxTargetItem); showToast('تم تثبيت البند في المقدمة 📌'); }
      sfx('select'); saveMeta(); $('actSh').classList.remove('on'); render();
    } else if(act === 'cart'){
      if(cart.has(ctxTargetItem)){ cart.delete(ctxTargetItem); showToast('تمت الإزالة من قائمة التسوق'); }
      else { cart.add(ctxTargetItem); showToast('تمت الإضافة لقائمة التسوق 🛒'); }
      sfx('select'); saveMeta(); $('actSh').classList.remove('on'); render();
    } else if(act === 'share'){
      const txt = `🛒 *${targetRec.item}* (${targetRec.brand||'بدون ماركة'})\n💰 السعر: ${num(targetRec.price)} ر.س (${num(targetRec.qty)} ${U[targetRec.unit][0]})\n📍 المكان: ${targetRec.store||'غير محدد'}\n📅 التاريخ: ${fd(targetRec.date)}`;
      if(navigator.share){ navigator.share({title:targetRec.item, text:txt}).catch(()=>{}); }
      else if(navigator.clipboard){ navigator.clipboard.writeText(txt); showToast('تم نسخ تفاصيل المنتج للحافظة 📋'); }
      sfx('success'); $('actSh').classList.remove('on');
    } else if(act === 'rename'){
      const newName = prompt('اكتب الاسم الجديد للبند لتوحيده في كل السجلات:', ctxTargetItem);
      if(newName && newName.trim() && newName.trim() !== ctxTargetItem){
        const nn = newName.trim();
        $('actSh').classList.remove('on');
        showToast('جاري تحديث الاسم...');
        for(const r of rows){ await db.doc('purchases/'+r.id).update({item:nn}).catch(()=>{}); }
        if(pinned.has(ctxTargetItem)){pinned.delete(ctxTargetItem);pinned.add(nn);saveMeta();}
        if(cart.has(ctxTargetItem)){cart.delete(ctxTargetItem);cart.add(nn);saveMeta();}
        if(cur===ctxTargetItem) cur=nn;
        sfx('success'); showToast('تم تغيير الاسم بنجاح ✨');
      }
    } else if(act === 'del'){
      if(!cact.dataset.confirm){
        sfx('delete');
        cact.dataset.confirm = '1';
        cact.querySelector('div:last-child').textContent = '⚠️ اضغط مرة أخرى لتأكيد الحذف النهائي!';
        return;
      }
      $('actSh').classList.remove('on');
      if(ctxTargetRec){
        await db.doc('purchases/'+ctxTargetRec.id).delete().catch(()=>{});
        if(ctxTargetRec.photo) await db.doc('photos/'+ctxTargetRec.id).delete().catch(()=>{});
        sfx('delete'); showToast('تم حذف السجل 🗑️');
      } else {
        for(const r of rows){
          await db.doc('purchases/'+r.id).delete().catch(()=>{});
          if(r.photo) await db.doc('photos/'+r.id).delete().catch(()=>{});
        }
        selected.delete(ctxTargetItem);
        sfx('delete'); showToast('تم حذف البند وجميع سجلاته 🗑️');
      }
    }
    return;
  }

  // أوامر شريط التحديد السفلي (Multi-Select Bar)
  if(e.target.closest('#selClearBtn')){
    sfx('tap'); selected.clear(); render(); return;
  }
  if(e.target.closest('#selAllBtn')){
    sfx('select');
    const allKeys = [...groups().keys()];
    if(selected.size === allKeys.length) selected.clear();
    else allKeys.forEach(k=>selected.add(k));
    render(); return;
  }
  const sact = e.target.closest('[data-sact]');
  if(sact){
    const act = sact.dataset.sact;
    const m = groups();
    const keys = [...selected];
    if(!keys.length) return;
    if(act === 'dup'){
      const rows = m.get(keys[0]);
      selected.clear(); render();
      if(rows && rows[0]) { openSheet(rows[0], false, true); showToast('نسخ مع التعديل ✨'); }
    } else if(act === 'edit'){
      const rows = m.get(keys[0]);
      selected.clear(); render();
      if(rows && rows[0]) openSheet(rows[0], true, false);
    } else if(act === 'cart'){
      keys.forEach(k => { if( keys.length===1 && cart.has(k) ) cart.delete(k); else cart.add(k); });
      saveMeta(); sfx('success'); selected.clear(); render();
      showToast('تم تحديث قائمة التسوق 🛒');
    } else if(act === 'pin'){
      keys.forEach(k => pinned.add(k));
      saveMeta(); sfx('success'); selected.clear(); render();
      showToast('تم تثبيت الأصناف المحددة 📌');
    } else if(act === 'share'){
      const lines = keys.map(k => {
        const l = (m.get(k)||[])[0];
        return l ? `• ${k} (${l.brand||'—'}): ${num(l.price)} ر.س` : `• ${k}`;
      }).join('\n');
      if(navigator.clipboard) navigator.clipboard.writeText('🛒 قائمة مشتريات Aylin Market:\n'+lines);
      sfx('success'); selected.clear(); render();
      showToast('تم نسخ القائمة للحافظة 📋');
    } else if(act === 'del'){
      if(!sact.dataset.c){
        sfx('delete'); sact.dataset.c = '1';
        sact.innerHTML = '<span>⚠️</span>تأكيد؟';
        setTimeout(()=>{delete sact.dataset.c; render()}, 3000);
        return;
      }
      for(const k of keys){
        const rows = m.get(k)||[];
        for(const r of rows){
          await db.doc('purchases/'+r.id).delete().catch(()=>{});
          if(r.photo) await db.doc('photos/'+r.id).delete().catch(()=>{});
        }
      }
      selected.clear(); sfx('delete'); showToast('تم حذف الأصناف المحددة 🗑️'); render();
    }
    return;
  }

  // إغلاق النوافذ المنبثقة عند الضغط على الخلفية
  if(e.target.classList.contains('sheet')&&e.target.id!=='lg'&&e.target.id!=='vf'){
    sfx('tap'); e.target.classList.remove('on'); return;
  }

  // التنقل بين البنود والتفاصيل
  const t=e.target.closest('[data-item],[data-id],#back');if(!t)return;
  if(t.id==='back'){ sfx('tap'); cur=null; }
  else if(t.dataset.item){
    if(selected.size > 0){
      const k = t.dataset.item;
      if(selected.has(k)) selected.delete(k); else selected.add(k);
      sfx('select'); render(); return;
    }
    sfx('tap'); cur=t.dataset.item;
  }
  else{
    const p=P.find(x=>x.id===t.dataset.id);
    if(p) openSheet(p,true,false);
    return;
  }
  render();window.scrollTo({top:0,behavior:'smooth'});
});

// دعم الضغط المطوّل (Long Press) على الكارت من الخارج للتحديد الفوري
let lpTimer = null;
document.addEventListener('touchstart', e=>{
  const card = e.target.closest('.row[data-item]');
  if(!card || e.target.closest('[data-menu],[data-sel]')) return;
  lpTimer = setTimeout(()=>{
    const k = card.dataset.item;
    if(selected.has(k)) selected.delete(k); else selected.add(k);
    sfx('select'); render();
  }, 480);
}, {passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>document.addEventListener(ev, ()=>clearTimeout(lpTimer), {passive:true}));

document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;if($('clrQ'))$('clrQ').hidden=!q;$('list').innerHTML=homeList(groups())}});

const show=id=>['lg','vf'].forEach(x=>$(x).classList.toggle('on',x===id));
const AM={'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة.','auth/wrong-password':'البريد أو كلمة المرور غير صحيحة.','auth/user-not-found':'البريد أو كلمة المرور غير صحيحة.','auth/email-already-in-use':'هذا الإيميل مسجل بالفعل، اضغط تسجيل الدخول.','auth/weak-password':'كلمة المرور قصيرة (6 أحرف على الأقل).','auth/invalid-email':'صيغة الإيميل غير صحيحة.','auth/network-request-failed':'تعذر الاتصال بالإنترنت.','auth/too-many-requests':'محاولات كثيرة، حاول بعد قليل.'};
const authMsg=e=>AM[e.code]||('تعذر تنفيذ الطلب ('+e.code+')');
$('lB').onclick=async()=>{sfx('tap');$('lErr').textContent='';try{await auth.signInWithEmailAndPassword($('lE').value.trim(),$('lP').value);sfx('success')}catch(e){sfx('delete');$('lErr').textContent=authMsg(e)}};
$('lN').onclick=async()=>{sfx('tap');$('lErr').textContent='';try{const c=await auth.createUserWithEmailAndPassword($('lE').value.trim(),$('lP').value);await c.user.sendEmailVerification();sfx('success')}catch(e){sfx('delete');$('lErr').textContent=authMsg(e)}};
$('lF').onclick=async()=>{sfx('tap');const m=$('lE').value.trim();if(!m){$('lErr').textContent='اكتب إيميلك أولا.';return}try{await auth.sendPasswordResetEmail(m);$('lErr').textContent='تم إرسال رابط إعادة تعيين كلمة المرور لبريدك.'}catch(e){$('lErr').textContent=authMsg(e)}};
$('vR').onclick=async()=>{sfx('tap');try{await auth.currentUser.sendEmailVerification();$('vErr').textContent='تم إرسال الرابط مرة أخرى.'}catch(e){$('vErr').textContent=authMsg(e)}};
$('vB').onclick=async()=>{sfx('tap');try{await auth.currentUser.reload();await auth.currentUser.getIdToken(true);if(auth.currentUser.emailVerified)enter();else $('vErr').textContent='لم يتم التأكيد بعد.'}catch(e){$('vErr').textContent=authMsg(e)}};
const out=()=>{sfx('tap');if(unsub){unsub();unsub=null}if(unsub2){unsub2();unsub2=null}P=[];cur=null;$('ban').innerHTML='';['mu','mb'].forEach(x=>$(x).classList.remove('on'));render();auth.signOut()};
$('vO').onclick=out;$('muOut').onclick=out;

function enter(){
  show(null);$('muMb').hidden=!isOwner();$('muLg').hidden=!isOwner();$('dlIcons').hidden=!isOwner();
  if(unsub)return;
  if(isOwner()){
    db.doc('config/brand').get().then(s=>{
      if(!s.exists||s.data().v!==2){db.doc('config/brand').set({logo:DEFAULT_LOGO,v:2}).catch(()=>{})}
    }).catch(()=>{});
  }
  unsub2=db.doc('config/brand').onSnapshot(s=>{if(s.exists&&s.data().logo&&s.data().v===2){LOGO=s.data().logo;try{localStorage.setItem('brandLogoV2',LOGO)}catch(e){}paintBrand()}},()=>{});
  unsub=db.collection('purchases').onSnapshot(s=>{
    $('ban').innerHTML='';P=s.docs.map(d=>Object.assign({id:d.id},d.data()));render();
  },e=>{
    unsub=null;
    $('ban').innerHTML=e.code==='permission-denied'?'<div class="banner">هذا الحساب غير مضاف. اطلب من المالك إضافة إيميلك من «المشاركة» ثم أعد فتح التطبيق.</div>':'<div class="banner">تعذر تحميل البيانات. تأكد من الاتصال.</div>';
  });
}
auth.onAuthStateChanged(u=>{
  if(!u){show('lg');return}
  if(!u.emailVerified&&!isOwner()){$('vMail').textContent=u.email;$('vErr').textContent='';show('vf');return}
  enter();
});

// القائمة والمشاركة والتصدير وتوليد الأيقونات
$('muX').onclick=()=>{sfx('tap');$('mu').classList.remove('on')};
$('muMb').onclick=async()=>{sfx('open');$('mb').classList.add('on');$('mbErr').textContent='';renderMembers(await loadMembers())};
$('mbX').onclick=()=>{sfx('tap');$('mb').classList.remove('on')};
async function loadMembers(){try{const s=await db.doc('config/members').get();return s.exists?(s.data().emails||[]):[]}catch(e){$('mbErr').textContent='تعذر تحميل القائمة.';return[]}}
function renderMembers(l){$('mbList').innerHTML=l.length?l.map(e=>`<div class="row detail-row" style="grid-template-columns:1fr auto;cursor:default"><span>${esc(e)}</span><button class="link" style="color:#e11d48" data-rm="${esc(e)}" type="button">إزالة</button></div>`).join(''):'<div class="empty">لا يوجد أعضاء مضافون بعد.</div>'}
$('mbAdd').onclick=async()=>{
  const e=$('mbE').value.trim().toLowerCase();$('mbErr').textContent='';
  if(!/^\S+@\S+\.\S+$/.test(e)){$('mbErr').textContent='اكتب إيميل صحيح.';return}
  const l=await loadMembers();if(!l.includes(e))l.push(e);
  try{await db.doc('config/members').set({emails:l});$('mbE').value='';sfx('success');renderMembers(l)}catch(x){$('mbErr').textContent='تعذر الحفظ.'}
};
document.addEventListener('click',async e=>{
  if(e.target.closest('#mn')){sfx('open');$('muMsg').textContent='';$('mu').classList.add('on');return}
  const r=e.target.closest('[data-rm]');if(!r)return;
  const l=(await loadMembers()).filter(x=>x!==r.dataset.rm);
  try{await db.doc('config/members').set({emails:l});sfx('delete');renderMembers(l)}catch(x){$('mbErr').textContent='تعذر الحذف.'}
});
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('exCsv').onclick=()=>{
  sfx('success');
  const c=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[...P].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const h=['البند','الماركة','الكمية','الوحدة','السعر','سعر الوحدة','التاريخ','المكان','ملاحظة','أضافها'];
  const body=rows.map(p=>[p.item,p.brand,p.qty,U[p.unit][0],p.price,num(ppu(p))+' / '+BL[U[p.unit][1]],p.date,p.store,p.note,p.by].map(c).join(','));
  dl('purchases-'+today()+'.csv','\ufeff'+[h.map(c).join(','),...body].join('\r\n'),'text/csv;charset=utf-8');
};
$('exJs').onclick=async()=>{
  sfx('tap');$('muMsg').textContent='جاري تجهيز النسخة الاحتياطية...';
  try{
    const ph={};
    for(const p of P){if(p.photo){const s=await db.doc('photos/'+p.id).get();if(s.exists)ph[p.id]=s.data().data}}
    dl('purchases-backup-'+today()+'.json',JSON.stringify({exported:today(),purchases:P,photos:ph}),'application/json');
    sfx('success');$('muMsg').textContent='تم تحميل ملف النسخة الاحتياطية بنجاح.';
  }catch(e){$('muMsg').textContent='تعذر تجهيز النسخة.'}
};
$('muLg').onclick=()=>{sfx('tap');$('lgF').click()};
$('lgF').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;$('muMsg').textContent='جاري تحديث اللوجو...';
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
    const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=320;
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,320,320);
    const dataUrl=c.toDataURL('image/jpeg',.88);
    await db.doc('config/brand').set({logo:dataUrl,v:2});
    LOGO=dataUrl;try{localStorage.setItem('brandLogoV2',LOGO)}catch(err){}
    paintBrand();sfx('success');
    $('muMsg').textContent='تم تحديث اللوجو بنجاح لكل المستخدمين!';
  }catch(x){$('muMsg').textContent='تعذر رفع الصورة. تأكد من صلاحيات Firestore.'}
  e.target.value='';
};
$('dlIcons').onclick=async()=>{
  sfx('tap');
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=LOGO});
    for(const [sz,fn] of [[192,'icon-192.png'],[512,'icon-512.png'],[512,'icon-maskable-512.png'],[180,'apple-touch-icon.png']]){
      const c=document.createElement('canvas');c.width=c.height=sz;
      const ctx=c.getContext('2d'),m=Math.min(im.width,im.height);
      ctx.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,sz,sz);
      c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;a.click()},'image/png');
    }
    sfx('success');$('muMsg').textContent='جاري تحميل الأيقونات الأربع لرفعها مع ملفات الموقع.';
  }catch(e){$('muMsg').textContent='تعذر توليد الأيقونات.'}
};
paintBrand();render();
</script>
