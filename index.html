<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Aylin Market</title>
<meta name="theme-color" content="#5e1442" id="metaTheme">
<meta name="apple-mobile-web-app-title" content="Aylin Market">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" id="fav" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #faf5f8;
  --sf: #ffffff;
  --sf2: #f3eaf0;
  --ink: #24111d;
  --mu: #785a6d;
  --ac: #7b1e58;
  --ac2: #4a0e34;
  --acf: #ffffff;
  --ln: #eadce5;
  --hi: #fff8e6;
  --hit: #b46900;
  --gold: #e5b84b;
  --shd: 0 8px 24px -4px rgba(94, 20, 66, 0.08), 0 2px 6px -1px rgba(94, 20, 66, 0.04);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #130910;
  --sf: #1f101a;
  --sf2: #2c1725;
  --ink: #f7edf3;
  --mu: #b597aa;
  --ac: #d44c9e;
  --ac2: #3d0d2b;
  --acf: #ffffff;
  --ln: #382030;
  --hi: #332409;
  --hit: #fbbf24;
  --gold: #f59e0b;
  --shd: 0 10px 28px -6px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;
  padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  transition: background-color .3s ease, color .3s ease;
  overflow-x: hidden;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
h1 { font-size: 20px; font-weight: 700; margin: 8px 0 14px; }
input, select, button { font: inherit; color: inherit; }

/* Animations */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 2px var(--gold), 0 0 16px rgba(229, 184, 75, 0.45); }
  50% { box-shadow: 0 0 0 3px var(--gold), 0 0 26px rgba(229, 184, 75, 0.8); }
}
@keyframes floatIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}

/* Luxury Hero Header */
.hero {
  background: radial-gradient(circle at 15% 20%, rgba(229, 184, 75, 0.18), transparent 45%),
              linear-gradient(135deg, #7b1e58 0%, #420b2d 100%);
  color: #fff;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 0 28px;
  border-radius: 0 0 28px 28px;
  box-shadow: 0 12px 30px rgba(74, 14, 52, 0.25);
  margin-bottom: -18px;
  position: relative;
  z-index: 2;
}
.hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
.lgo {
  flex: none; width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 24px;
  animation: pulseGlow 3.5s infinite ease-in-out;
  border: 2px solid #fff;
}
.bn { font-size: 21px; font-weight: 700; line-height: 1.2; letter-spacing: -0.2px; color: #fff; }
.bs { font-size: 13px; color: rgba(255, 255, 255, 0.82); display: flex; align-items: center; gap: 6px; }
.bs::before { content: "✦"; color: var(--gold); font-size: 11px; }
.hdr-btns { display: flex; gap: 8px; }
.mnb {
  flex: none; width: 42px; height: 42px; border-radius: 13px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(8px);
  color: #fff; font-size: 18px; cursor: pointer;
  display: grid; place-items: center;
  transition: transform .15s var(--ease), background .2s;
}
.mnb:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.22); }

/* Search Bar */
.search-box {
  position: relative; z-index: 3; margin: 0 0 14px;
}
.search-box .in {
  padding-inline-start: 42px;
  background: var(--sf);
  border: 1px solid var(--ln);
  box-shadow: var(--shd);
  border-radius: 16px;
  height: 50px;
}
.search-ic {
  position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%);
  color: var(--mu); pointer-events: none; font-size: 17px;
}

/* Dashboard Summary Pills */
.dash {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px;
  animation: floatIn .35s var(--ease) both;
}
.d-card {
  background: var(--sf); border: 1px solid var(--ln); border-radius: 16px;
  padding: 10px 12px; box-shadow: var(--shd); text-align: center;
}
.d-card span { font-size: 11.5px; color: var(--mu); display: block; }
.d-card b { font-size: 17px; font-weight: 700; color: var(--ac); display: block; margin-top: 2px; }

/* Inputs */
.in {
  width: 100%; padding: 13px 14px; border: 1.5px solid var(--ln);
  border-radius: 14px; background: var(--sf);
  transition: border-color .2s, box-shadow .2s, transform .15s;
}
.in:focus {
  border-color: var(--ac); outline: none;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 18%, transparent);
}

/* Product Cards & Rows */
.row {
  display: grid; grid-template-columns: 56px 1fr auto; gap: 13px; align-items: center;
  width: 100%; text-align: start; background: var(--sf);
  border: 1px solid var(--ln); border-radius: 18px;
  padding: 12px; margin-bottom: 10px; cursor: pointer;
  box-shadow: var(--shd);
  animation: fadeUp .35s var(--ease) both;
  transition: transform .18s var(--ease), border-color .2s, box-shadow .2s;
  position: relative; overflow: hidden;
}
.row:hover { border-color: color-mix(in srgb, var(--ac) 40%, var(--ln)); }
.row:active { transform: scale(0.975); }
.th {
  width: 56px; height: 56px; border-radius: 14px;
  background: linear-gradient(135deg, var(--sf2), var(--ln));
  object-fit: cover; display: grid; place-items: center;
  color: var(--ac); font-weight: 700; font-size: 20px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
}
.item-title { font-weight: 700; font-size: 16px; margin-bottom: 2px; }
.pr { font-weight: 700; font-size: 17px; text-align: end; color: var(--ac); }
.sub { color: var(--mu); font-size: 12.5px; }
.pill {
  display: inline-block; background: var(--sf2); color: var(--ink);
  padding: 2px 8px; border-radius: 8px; font-size: 11.5px; font-weight: 500; margin-top: 3px;
}
.best {
  border: 1.5px solid var(--gold);
  background: linear-gradient(to left, var(--hi), var(--sf) 65%);
}
.tag {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 11px; background: var(--hi); color: var(--hit);
  border: 1px solid color-mix(in srgb, var(--hit) 30%, transparent);
  padding: 2px 8px; border-radius: 99px; font-weight: 700; margin-inline-start: 6px;
}
.hit { border-color: var(--ac); }

/* Detail View Stats */
.detail-hd {
  padding: calc(14px + env(safe-area-inset-top, 0px)) 0 6px;
  display: flex; align-items: center; justify-content: space-between;
}
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--sf); border: 1px solid var(--ln); color: var(--ink);
  padding: 8px 14px; border-radius: 12px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shd); transition: transform .15s;
}
.back-btn:active { transform: scale(0.95); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 12px 0 18px; }
.stat {
  background: var(--sf); border: 1px solid var(--ln); border-radius: 18px;
  padding: 12px 10px; box-shadow: var(--shd); position: relative; overflow: hidden;
  animation: floatIn .3s var(--ease) both;
}
.stat::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 3px;
  background: var(--ac); opacity: .7;
}
.stat.st-best::after { background: var(--gold); opacity: 1; }
.stat b { display: block; font-size: 20px; font-weight: 700; margin: 2px 0; color: var(--ink); }

/* Bottom Floating Action Bar */
.bar {
  position: fixed; inset: auto 0 0 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 65%, transparent);
  backdrop-filter: blur(6px);
  z-index: 5; pointer-events: none;
}
.bar .btn { pointer-events: auto; max-width: 528px; margin: 0 auto; box-shadow: 0 10px 25px rgba(123, 30, 88, 0.38); }

/* Buttons */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 15px; border: 0; border-radius: 16px;
  background: linear-gradient(135deg, var(--ac), #521039);
  color: var(--acf); font-weight: 700; font-size: 15.5px; cursor: pointer;
  transition: transform .15s var(--ease), opacity .2s, box-shadow .2s;
}
.btn:active { transform: scale(0.97); }
.btn.g {
  background: var(--sf); color: var(--ink);
  border: 1.5px solid var(--ln); margin-top: 9px; box-shadow: none; font-weight: 600;
}
.btn.danger { color: #e11d48; border-color: rgba(225, 29, 72, 0.25); }
.btn:disabled { opacity: .5; pointer-events: none; }
.link { background: none; border: 0; color: var(--ac); padding: 8px 0; font-weight: 600; cursor: pointer; }

/* Animated Bottom Sheets & Modals */
.sheet {
  position: fixed; inset: 0;
  background: rgba(15, 5, 12, 0.55);
  backdrop-filter: blur(8px);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 10; opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .28s var(--ease), visibility .28s;
}
.sheet.on { opacity: 1; visibility: visible; pointer-events: auto; }
.sheet > .wrap {
  width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  background: var(--bg);
  border-radius: 28px 28px 0 0;
  padding: 12px 18px calc(28px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.28);
  transform: translateY(100%);
  transition: transform .34s var(--ease);
}
.sheet.on > .wrap { transform: translateY(0); }
.sheet > .wrap::before {
  content: ""; display: block; width: 42px; height: 5px;
  background: var(--ln); border-radius: 99px; margin: 4px auto 14px;
}

/* Fullscreen Login Screen */
#lg.sheet { align-items: stretch; background: linear-gradient(155deg, #5e1442 0%, #240619 100%); }
#lg > .wrap {
  max-height: none; border-radius: 0; background: transparent; color: #fff;
  display: flex; flex-direction: column; justify-content: center;
  transform: scale(0.96); box-shadow: none;
}
#lg.on > .wrap { transform: scale(1); }
#lg > .wrap::before { display: none; }
.lg-card {
  background: var(--sf); color: var(--ink);
  padding: 22px 18px; border-radius: 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}
.lg-hero { text-align: center; margin-bottom: 22px; }
.lg-hero .brand { flex-direction: column; gap: 10px; }
.lg-hero .lgo { width: 92px; height: 92px; font-size: 34px; }
.lg-hero .bn { font-size: 26px; }

label { display: block; font-size: 13px; font-weight: 600; color: var(--mu); margin: 12px 0 5px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.prev { width: 100%; max-height: 210px; object-fit: cover; border-radius: 14px; margin-top: 10px; border: 1px solid var(--ln); }
.banner { background: var(--hi); color: var(--hit); padding: 12px 14px; border-radius: 14px; margin: 12px 0; font-weight: 600; border: 1px solid color-mix(in srgb, var(--hit) 30%, transparent); }
.err { color: #e11d48; min-height: 20px; font-size: 13.5px; font-weight: 600; margin: 8px 0; }
.empty {
  color: var(--mu); text-align: center; padding: 44px 16px;
  background: var(--sf); border: 1px dashed var(--ln); border-radius: 20px; margin-top: 12px;
}
.empty-ic { font-size: 40px; display: block; margin-bottom: 8px; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="wrap"><div id="ban"></div></div>

const U={g:['جم','kg',.001],kg:['كجم','kg',1],ml:['مل','L',.001],L:['لتر','L',1],pc:['حبة','pc',1]};

const OWNER='faragm100@gmail.com';
firebase.initializeApp(CFG);
const auth=firebase.auth();
let db=firebase.firestore(),P=[],cur=null,q='',edit=null,photo=null,unsub=null,unsub2=null;const PC={};

// إدارة الثيم (فاتح / داكن)
let theme=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function applyTheme(){

}

let LOGO=DEFAULT_LOGO;
try{LOGO=localStorage.getItem('brandLogoV2')||DEFAULT_LOGO}catch(e){}
const brandHtml=()=>`<img class="lgo" src="${LOGO}" alt="Aylin Market"><div><div class="bn">Aylin Market</div><div class="bs">مشتريات البيت</div></div>`;
function paintBrand(){
  document.querySelectorAll('.brand').forEach(b=>b.innerHTML=brandHtml());
  if(LOGO)$('fav').href=LOGO;
}
const isOwner=()=>!!auth.currentUser&&(auth.currentUser.email||'').toLowerCase()===OWNER;
const who=()=>((auth.currentUser&&auth.currentUser.email)||'').split('@')[0];

function groups(){
  const m=new Map();
  for(const p of P){const k=p.item;if(!m.has(k))m.set(k,[]);m.get(k).push(p)}
  for(const a of m.values())a.sort((x,y)=>(y.date||'').localeCompare(x.date||'')||y.ts-x.ts);
  return m;
}
const thumb=p=>p.photo?`<img class="th" alt="" data-ph="${esc(p.id)}">`:`<div class="th">${esc((p.item||'أ')[0])}</div>`;

const nz=v=>String(v==null?'':v).toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
const FL=[['item','البند'],['brand','الماركة'],['store','المكان'],['note','ملاحظة'],['by','أضافها'],['price','السعر'],['qty','الوزن'],['date','التاريخ']];
function matchP(p,ws){const t=nz([p.item,p.brand,p.store,p.note,p.by,p.date,fd(p.date),p.price,p.qty,U[p.unit][0]].join(' '));return ws.every(w=>t.includes(w))}
function whyP(p,w){for(const [k,l] of FL){const v=k==='date'?fd(p.date):p[k];if(nz(v).includes(w))return l+': '+(k==='qty'?num(v)+' '+U[p.unit][0]:v)}return ''}

function dashHtml(m){
  const curMonth=today().slice(0,7);
  const mSum=P.filter(p=>(p.date||'').startsWith(curMonth)).reduce((a,b)=>a+(+b.price||0),0);
  return `<div class="dash">
    <div class="d-card"><span>الأصناف</span><b>${m.size}</b></div>
    <div class="d-card"><span>المشتريات</span><b>${P.length}</b></div>
    <div class="d-card"><span>مشتريات الشهر</span><b>${num(mSum)} <small style="font-size:11px">ر.س</small></b></div>
  </div>`;
}

function homeList(m){
  if(!m.size)return '<div class="empty"><span class="empty-ic">🛒</span>لا توجد مشتريات مسجلة بعد.<br>ابدأ بتسجيل أول مشترى من الزر بالأسفل.</div>';
  const ws=nz(q).split(/\s+/).filter(Boolean);
  const ents=[...m.entries()].map(([k,r])=>{
    if(!ws.length)return{k,r,why:''};
    const hp=r.find(p=>matchP(p,ws));if(!hp)return null;
    const rest=ws.find(w=>!nz(k).includes(w));
    return{k,r,why:rest?whyP(hp,rest):''};
  }).filter(Boolean);
  if(!ents.length)return '<div class="empty"><span class="empty-ic">🔍</span>لا توجد نتائج مطابقة لبحثك.</div>';
  ents.sort((a,b)=>(b.r[0].date||'').localeCompare(a.r[0].date||''));
  return ents.map(({k,r,why},idx)=>{const l=r[0];
    return `<button class="row" style="animation-delay:${Math.min(idx*0.035,0.35)}s" data-item="${esc(k)}">${thumb(l)}<div><div class="item-title">${esc(k)}</div><div class="sub">${r.length} عملية شراء · آخرها ${fd(l.date)}</div>${why?`<div class="sub" style="color:var(--ac);font-weight:600">${esc(why)}</div>`:''}</div><div class="pr">${num(l.price)} <small style="font-size:12px">ر.س</small><div><span class="pill">${esc(l.brand||'بدون ماركة')}</span></div></div></button>`}).join('');
}

function itemView(rows){
  const b=U[rows[0].unit][1],same=rows.filter(p=>U[p.unit][1]===b);
  const pp=same.map(ppu),min=Math.min(...pp),avg=pp.reduce((a,c)=>a+c,0)/pp.length;
  const best=same.find(p=>ppu(p)===min),l=rows[0],u=BL[b];
  const ws=nz(q).split(/\s+/).filter(Boolean);
  const list=rows.map((p,idx)=>{
    const isBest=same.length>1&&U[p.unit][1]===b&&ppu(p)===min;
    return `<button class="row${isBest?' best':''}${ws.length&&matchP(p,ws)?' hit':''}" style="animation-delay:${Math.min(idx*0.04,0.35)}s" data-id="${esc(p.id)}">${thumb(p)}<div><div class="item-title">${esc(p.brand)||'بدون ماركة'}${isBest?'<span class="tag">★ الأرخص</span>':''}</div><div class="sub">${num(p.qty)} ${U[p.unit][0]} · ${fd(p.date)}${p.store?' · 📍 '+esc(p.store):''}${p.by?' · 👤 '+esc(p.by):''}</div>${p.note?`<div class="sub" style="color:var(--ac)">📝 ${esc(p.note)}</div>`:''}</div><div class="pr">${num(p.price)} <small style="font-size:12px">ر.س</small><div class="sub">${num(ppu(p))} / ${BL[U[p.unit][1]]}</div></div></button>`}).join('');
  return `<div class="wrap"><div class="detail-hd"><button class="back-btn" id="back">‹ كل البنود</button><span class="sub">${rows.length} سجلات</span></div><h1>${esc(l.item)}</h1>
  <div class="stats"><div class="stat"><span class="sub">آخر سعر</span><b>${num(l.price)}</b><span class="sub">${num(ppu(l))} / ${u}</span></div>
  <div class="stat st-best"><span class="sub">أرخص سعر</span><b>${num(min)}</b><span class="sub">/ ${u} · ${esc(best.brand)||'—'}</span></div>
  <div class="stat"><span class="sub">المتوسط</span><b>${num(avg)}</b><span class="sub">/ ${u}</span></div></div>${list}</div>`;
}

function render(){
  const m=groups();
  $('dItems').innerHTML=[...m.keys()].map(k=>`<option value="${esc(k)}">`).join('');
  $('dBrands').innerHTML=[...new Set(P.map(p=>p.brand).filter(Boolean))].map(k=>`<option value="${esc(k)}">`).join('');
  $('dStores').innerHTML=[...new Set(P.map(p=>p.store).filter(Boolean))].map(k=>`<option value="${esc(k)}">`).join('');
  if(cur&&!m.has(cur))cur=null;
  if(cur){$('app').innerHTML=itemView(m.get(cur))}
  else{
    if(!$('list'))$('app').innerHTML=`<div class="hero"><div class="wrap"><header class="hd"><div class="brand">${brandHtml()}</div><div class="hdr-btns"><button class="mnb" id="thBtn" type="button" aria-label="المظهر">${theme==='dark'?'☀️':'🌙'}</button><button class="mnb" id="mn" type="button" aria-label="القائمة">☰</button></div></header></div></div><div class="wrap"><div class="search-box"><span class="search-ic">🔍</span><input class="in" id="q" placeholder="ابحث بالبند أو الماركة أو المكان..." value="${esc(q)}"></div><div id="dashWrap"></div><div id="list"></div></div>`;
    if($('dashWrap'))$('dashWrap').innerHTML=dashHtml(m);
    $('list').innerHTML=homeList(m);
  }
  document.querySelectorAll('img[data-ph]').forEach(im=>{
    const id=im.dataset.ph;
    if(PC[id]){im.src=PC[id];return}
    if(!db||im.dataset.l)return;im.dataset.l=1;
    db.doc('photos/'+id).get().then(s=>{if(s.exists){PC[id]=s.data().data;document.querySelectorAll('img[data-ph="'+id+'"]').forEach(x=>x.src=PC[id])}}).catch(()=>{});
  });
}

function openSheet(src,isEdit){
  edit=isEdit?src:null;photo=null;
  $('shT').textContent=isEdit?'تعديل بيانات المشترى':'تسجيل مشترى جديد';
  $('fItem').value=src?src.item:'';
  $('fBrand').value=src?src.brand||'':'';
  $('fQty').value=src?src.qty:'';
  $('fUnit').value=src?src.unit:'g';
  $('fPrice').value=isEdit?src.price:'';
  $('fPrice').placeholder=src&&!isEdit?'آخر سعر '+num(src.price)+' ر.س':'0.00';
  $('fDate').value=isEdit?src.date:today();
  $('fStore').value=src?src.store||'':'';
  $('fNote').value=isEdit?src.note||'':'';
  $('fPhoto').value='';$('fPrev').hidden=true;
  if(isEdit&&src.photo){
    const show=d=>{$('fPrev').src=d;$('fPrev').hidden=false};
    if(PC[src.id])show(PC[src.id]);
    else db.doc('photos/'+src.id).get().then(s=>{if(s.exists)show(PC[src.id]=s.data().data)}).catch(()=>{});
  }
  $('del').hidden=!isEdit;$('err').textContent='';
  $('sh').classList.add('on');$('sh').querySelector('.wrap').scrollTop=0;
}
const closeSheet=()=>$('sh').classList.remove('on');

function shrink(f){return new Promise((res,rej)=>{
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);let d=c.toDataURL('image/jpeg',.6);if(d.length>230000)d=c.toDataURL('image/jpeg',.35);res(d)};
  im.onerror=rej;im.src=u;
})}

$('add').onclick=()=>openSheet(cur?groups().get(cur)[0]:null,false);
$('cancel').onclick=closeSheet;
function autofill(byBrand){
  if(edit)return;
  const m=groups().get($('fItem').value.trim());if(!m)return;
  const br=$('fBrand').value.trim();
  const l=(br&&m.find(p=>p.brand===br))||(byBrand?null:m[0]);
  if(!l)return;
  if(!byBrand)$('fBrand').value=l.brand||'';
  $('fQty').value=l.qty;$('fUnit').value=l.unit;$('fStore').value=l.store||'';
  $('fPrice').placeholder='آخر سعر '+num(l.price)+' ر.س';
}
$('fItem').onchange=()=>autofill(false);
$('fBrand').onchange=()=>autofill(true);
let stream=null;
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('cm').classList.remove('on')}
$('gal').onclick=()=>$('fPhoto').click();
$('cam').onclick=async()=>{
  $('err').textContent='';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    $('vid').srcObject=stream;$('cm').classList.add('on');
  }catch(x){stream=null;$('err').textContent='الكاميرا غير متاحة، اختر صورة من المعرض.'}
};
$('cmx').onclick=stopCam;
$('snap').onclick=()=>{
  const v=$('vid');if(!v.videoWidth)return;
  const s=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');
  c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  let d=c.toDataURL('image/jpeg',.6);if(d.length>230000)d=c.toDataURL('image/jpeg',.35);
  photo=d;$('fPrev').src=d;$('fPrev').hidden=false;stopCam();
};
$('fPhoto').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{photo=await shrink(f);$('fPrev').src=photo;$('fPrev').hidden=false}catch(x){$('err').textContent='تعذر قراءة الصورة.'}
};
$('save').onclick=async()=>{
  const item=$('fItem').value.trim(),qty=+$('fQty').value,price=+$('fPrice').value;
  if(!item||!(qty>0)||$('fPrice').value===''||!(price>=0)){$('err').textContent='اكتب اسم البند والوزن أو الكمية والسعر.';return}
  if(!db){$('err').textContent='سجّل الدخول أولا لحفظ البيانات.';return}
  const id=edit?edit.id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const rec={item,brand:$('fBrand').value.trim(),qty,unit:$('fUnit').value,price,date:$('fDate').value||today(),store:$('fStore').value.trim(),note:$('fNote').value.trim(),photo:!!(photo||(edit&&edit.photo)),ts:edit?edit.ts:Date.now(),by:edit&&edit.by?edit.by:who()};
  $('save').disabled=true;$('err').textContent='';
  try{
    if(photo){await db.doc('photos/'+id).set({data:photo});PC[id]=photo}
    await db.doc('purchases/'+id).set(rec);
    closeSheet();
  }catch(x){$('err').textContent='تعذر الحفظ. تأكد من الاتصال وصلاحية التعديل.'}
  finally{$('save').disabled=false}
};
$('del').onclick=async()=>{
  const b=$('del');
  if(!b.dataset.c){b.dataset.c=1;b.textContent='اضغط مرة أخرى لتأكيد الحذف النهائي';setTimeout(()=>{delete b.dataset.c;b.textContent='حذف المشترى'},3000);return}
  try{await db.doc('purchases/'+edit.id).delete();if(edit.photo)await db.doc('photos/'+edit.id).delete();closeSheet()}
  catch(x){$('err').textContent='تعذر الحذف.'}
  delete b.dataset.c;b.textContent='حذف المشترى';
};
document.addEventListener('click',e=>{
  if(e.target.closest('#thBtn')){theme=theme==='dark'?'light':'dark';localStorage.setItem('theme',theme);applyTheme();return}
  if(e.target.classList.contains('sheet')&&e.target.id!=='lg'&&e.target.id!=='vf'){e.target.classList.remove('on');return}
  const t=e.target.closest('[data-item],[data-id],#back');if(!t)return;
  if(t.id==='back'){cur=null}
  else if(t.dataset.item){cur=t.dataset.item}
  else{const p=P.find(x=>x.id===t.dataset.id);if(p)openSheet(p,true);return}
  render();window.scrollTo({top:0,behavior:'smooth'});
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('list').innerHTML=homeList(groups())}});

const show=id=>['lg','vf'].forEach(x=>$(x).classList.toggle('on',x===id));
const AM={'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة.','auth/wrong-password':'البريد أو كلمة المرور غير صحيحة.','auth/user-not-found':'البريد أو كلمة المرور غير صحيحة.','auth/email-already-in-use':'هذا الإيميل مسجل بالفعل، اضغط تسجيل الدخول.','auth/weak-password':'كلمة المرور قصيرة (6 أحرف على الأقل).','auth/invalid-email':'صيغة الإيميل غير صحيحة.','auth/network-request-failed':'تعذر الاتصال بالإنترنت.','auth/too-many-requests':'محاولات كثيرة، حاول بعد قليل.'};
const authMsg=e=>AM[e.code]||('تعذر تنفيذ الطلب ('+e.code+')');
$('lB').onclick=async()=>{$('lErr').textContent='';try{await auth.signInWithEmailAndPassword($('lE').value.trim(),$('lP').value)}catch(e){$('lErr').textContent=authMsg(e)}};
$('lN').onclick=async()=>{$('lErr').textContent='';try{const c=await auth.createUserWithEmailAndPassword($('lE').value.trim(),$('lP').value);await c.user.sendEmailVerification()}catch(e){$('lErr').textContent=authMsg(e)}};
$('lF').onclick=async()=>{const m=$('lE').value.trim();if(!m){$('lErr').textContent='اكتب إيميلك أولا.';return}try{await auth.sendPasswordResetEmail(m);$('lErr').textContent='تم إرسال رابط إعادة تعيين كلمة المرور لبريدك.'}catch(e){$('lErr').textContent=authMsg(e)}};
$('vR').onclick=async()=>{try{await auth.currentUser.sendEmailVerification();$('vErr').textContent='تم إرسال الرابط مرة أخرى.'}catch(e){$('vErr').textContent=authMsg(e)}};
$('vB').onclick=async()=>{try{await auth.currentUser.reload();await auth.currentUser.getIdToken(true);if(auth.currentUser.emailVerified)enter();else $('vErr').textContent='لم يتم التأكيد بعد.'}catch(e){$('vErr').textContent=authMsg(e)}};
const out=()=>{if(unsub){unsub();unsub=null}if(unsub2){unsub2();unsub2=null}P=[];cur=null;$('ban').innerHTML='';['mu','mb'].forEach(x=>$(x).classList.remove('on'));render();auth.signOut()};
$('vO').onclick=out;$('muOut').onclick=out;

function enter(){
  show(null);$('muMb').hidden=!isOwner();$('muLg').hidden=!isOwner();$('dlIcons').hidden=!isOwner();
  if(unsub)return;
  if(isOwner()){
    db.doc('config/brand').get().then(s=>{
      if(!s.exists||s.data().v!==2){db.doc('config/brand').set({logo:DEFAULT_LOGO,v:2}).catch(()=>{})}
    }).catch(()=>{});
  }
  unsub2=db.doc('config/brand').onSnapshot(s=>{if(s.exists&&s.data().logo&&s.data().v===2){LOGO=s.data().logo;try{localStorage.setItem('brandLogoV2',LOGO)}catch(e){}paintBrand()}},()=>{});
  unsub=db.collection('purchases').onSnapshot(s=>{
    $('ban').innerHTML='';P=s.docs.map(d=>Object.assign({id:d.id},d.data()));render();
  },e=>{
    unsub=null;
    $('ban').innerHTML=e.code==='permission-denied'?'<div class="banner">هذا الحساب غير مضاف. اطلب من المالك إضافة إيميلك من «المشاركة» ثم أعد فتح التطبيق.</div>':'<div class="banner">تعذر تحميل البيانات. تأكد من الاتصال.</div>';
  });
}
auth.onAuthStateChanged(u=>{
  if(!u){show('lg');return}
  if(!u.emailVerified&&!isOwner()){$('vMail').textContent=u.email;$('vErr').textContent='';show('vf');return}
  enter();
});

// القائمة والمشاركة والتصدير وتوليد الأيقونات
$('muX').onclick=()=>$('mu').classList.remove('on');
$('muMb').onclick=async()=>{$('mb').classList.add('on');$('mbErr').textContent='';renderMembers(await loadMembers())};
$('mbX').onclick=()=>$('mb').classList.remove('on');
async function loadMembers(){try{const s=await db.doc('config/members').get();return s.exists?(s.data().emails||[]):[]}catch(e){$('mbErr').textContent='تعذر تحميل القائمة.';return[]}}
function renderMembers(l){$('mbList').innerHTML=l.length?l.map(e=>`<div class="row" style="grid-template-columns:1fr auto;cursor:default"><span>${esc(e)}</span><button class="link" style="color:#e11d48" data-rm="${esc(e)}" type="button">إزالة</button></div>`).join(''):'<div class="empty">لا يوجد أعضاء مضافون بعد.</div>'}
$('mbAdd').onclick=async()=>{
  const e=$('mbE').value.trim().toLowerCase();$('mbErr').textContent='';
  if(!/^\S+@\S+\.\S+$/.test(e)){$('mbErr').textContent='اكتب إيميل صحيح.';return}
  const l=await loadMembers();if(!l.includes(e))l.push(e);
  try{await db.doc('config/members').set({emails:l});$('mbE').value='';renderMembers(l)}catch(x){$('mbErr').textContent='تعذر الحفظ.'}
};
document.addEventListener('click',async e=>{
  if(e.target.closest('#mn')){$('muMsg').textContent='';$('mu').classList.add('on');return}
  const r=e.target.closest('[data-rm]');if(!r)return;
  const l=(await loadMembers()).filter(x=>x!==r.dataset.rm);
  try{await db.doc('config/members').set({emails:l});renderMembers(l)}catch(x){$('mbErr').textContent='تعذر الحذف.'}
});
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('exCsv').onclick=()=>{
  const c=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[...P].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const h=['البند','الماركة','الكمية','الوحدة','السعر','سعر الوحدة','التاريخ','المكان','ملاحظة','أضافها'];
  const body=rows.map(p=>[p.item,p.brand,p.qty,U[p.unit][0],p.price,num(ppu(p))+' / '+BL[U[p.unit][1]],p.date,p.store,p.note,p.by].map(c).join(','));
  dl('purchases-'+today()+'.csv','\ufeff'+[h.map(c).join(','),...body].join('\r\n'),'text/csv;charset=utf-8');
};
$('exJs').onclick=async()=>{
  $('muMsg').textContent='جاري تجهيز النسخة الاحتياطية...';
  try{
    const ph={};
    for(const p of P){if(p.photo){const s=await db.doc('photos/'+p.id).get();if(s.exists)ph[p.id]=s.data().data}}
    dl('purchases-backup-'+today()+'.json',JSON.stringify({exported:today(),purchases:P,photos:ph}),'application/json');
    $('muMsg').textContent='تم تحميل ملف النسخة الاحتياطية بنجاح.';
  }catch(e){$('muMsg').textContent='تعذر تجهيز النسخة.'}
};
$('muLg').onclick=()=>$('lgF').click();
$('lgF').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;$('muMsg').textContent='جاري تحديث اللوجو...';
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
    const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=320;
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,320,320);
    const dataUrl=c.toDataURL('image/jpeg',.88);
    await db.doc('config/brand').set({logo:dataUrl,v:2});
    LOGO=dataUrl;try{localStorage.setItem('brandLogoV2',LOGO)}catch(err){}
    paintBrand();
    $('muMsg').textContent='تم تحديث اللوجو بنجاح لكل المستخدمين!';
  }catch(x){$('muMsg').textContent='تعذر رفع الصورة. تأكد من صلاحيات Firestore.'}
  e.target.value='';
};
$('dlIcons').onclick=async()=>{
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=LOGO});
    for(const [sz,fn] of [[192,'icon-192.png'],[512,'icon-512.png'],[512,'icon-maskable-512.png'],[180,'apple-touch-icon.png']]){
      const c=document.createElement('canvas');c.width=c.height=sz;
      const ctx=c.getContext('2d'),m=Math.min(im.width,im.height);
      ctx.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,sz,sz);
      c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;a.click()},'image/png');
    }
    $('muMsg').textContent='جاري تحميل الأيقونات الأربع لرفعها مع ملفات الموقع.';
  }catch(e){$('muMsg').textContent='تعذر توليد الأيقونات.'}
};
paintBrand();render();
</script>
